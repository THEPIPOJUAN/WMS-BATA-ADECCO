# PLAN B · Igual que wms_sync.yml pero corre en TU PC (Windows) con la red de tu empresa.
# Úsalo SOLO si el diagnóstico dice que el WMS bloquea a GitHub. Borra entonces wms_sync.yml para que no corran los dos.
# Requisitos: Python instalado (marcar "Add Python to PATH") y el "runner" de GitHub instalado en la PC (ver LEEME_WMS.txt, PLAN B).
name: Sincronizar WMS (PC)
on:
  schedule:
    - cron: '*/15 12-23 * * 1-6'
  workflow_dispatch:
    inputs:
      modo:
        description: 'diagnostico · probar · sincronizar'
        default: 'sincronizar'
permissions:
  contents: write
concurrency:
  group: wms-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Conectar con el WMS
        env:
          WMS_USER: ${{ secrets.WMS_USER }}
          WMS_PASS: ${{ secrets.WMS_PASS }}
          WMS_BASE: ${{ vars.WMS_BASE }}
          WMS_ENTIDAD: ${{ vars.WMS_ENTIDAD }}
          WMS_CAMPO_FECHA: ${{ vars.WMS_CAMPO_FECHA }}
          WMS_MAPEO: ${{ vars.WMS_MAPEO }}
          WMS_DIAS: ${{ vars.WMS_DIAS }}
          WMS_TZ_API: ${{ vars.WMS_TZ_API }}
        run: |
          $modo = "${{ github.event.inputs.modo }}"
          if ($modo -eq "probar" -or $modo -eq "diagnostico") { python wms_sync.py $modo } else { python wms_sync.py }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guardar los datos nuevos en el repositorio
        if: ${{ github.event.inputs.modo != 'probar' && github.event.inputs.modo != 'diagnostico' }}
        run: |
          git config user.name "wms-sync"
          git config user.email "wms-sync@users.noreply.github.com"
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "WMS $(Get-Date -Format 'yyyy-MM-dd HH:mm')"; git push }
