# Sincroniza PACKING desde el WMS cada 15 minutos y deja los datos en la carpeta data/
name: Sincronizar WMS
on:
  schedule:
    # Cada 15 min, de 07:00 a 18:59 hora Perú (12:00–23:59 UTC), de lunes a sábado.  Para cambiar el horario edita esta línea.
    - cron: '*/15 12-23 * * 1-6'
  workflow_dispatch:
    inputs:
      modo:
        description: 'probar = solo muestra los campos del WMS · sincronizar = trae los datos'
        default: 'sincronizar'
permissions:
  contents: write
concurrency:
  group: wms-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conectar con el WMS
        env:
          WMS_USER: ${{ secrets.WMS_USER }}
          WMS_PASS: ${{ secrets.WMS_PASS }}
          WMS_BASE: ${{ vars.WMS_BASE }}
          WMS_ENTIDAD: ${{ vars.WMS_ENTIDAD }}
          WMS_CAMPO_FECHA: ${{ vars.WMS_CAMPO_FECHA }}
          WMS_MAPEO: ${{ vars.WMS_MAPEO }}
          WMS_DIAS: ${{ vars.WMS_DIAS }}
          WMS_TZ_API: ${{ vars.WMS_TZ_API }}
        run: |
          if [ "${{ github.event.inputs.modo }}" = "probar" ]; then python wms_sync.py probar; else python wms_sync.py; fi
      - name: Guardar los datos nuevos en el repositorio
        if: ${{ github.event.inputs.modo != 'probar' }}
        run: |
          git config user.name "wms-sync"
          git config user.email "wms-sync@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "WMS $(date -u '+%Y-%m-%d %H:%M') UTC" && git push)
